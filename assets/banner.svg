<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Radial Glow Behind Shield -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 45px; opacity: 0.8; stroke-width: 2px; }
        50% { opacity: 0.4; stroke-width: 1.5px; }
        100% { r: 110px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes pulseRing2 {
        0% { r: 20px; opacity: 0.9; stroke-width: 2.5px; }
        60% { opacity: 0.3; }
        100% { r: 85px; opacity: 0; stroke-width: 0.8px; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      .radar-sweep-line {
        transform-origin: 980px 190px;
        animation: radarSweep 10s linear infinite;
      }
      .pulse-circle-1 {
        transform-origin: 980px 190px;
        animation: pulseRing 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .pulse-circle-2 {
        transform-origin: 980px 190px;
        animation: pulseRing2 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 2s;
      }
      .circuit-flow {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .beacon-dot {
        transform-origin: center;
        animation: beaconBlink 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#cyberGrid)" rx="16" />

  <!-- Ambient Animated Light Orbs in Background -->
  <circle cx="980" cy="190" r="160" fill="url(#centerGlow)" />
  <circle cx="150" cy="80" r="130" fill="url(#centerGlow)" opacity="0.4" />

  <!-- Dynamic Radar Scanner & Node Graphic (Right Side Background/Midground) -->
  <g opacity="0.75">
    <!-- Concentric Target / Risk Rings -->
    <circle cx="980" cy="190" r="125" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="980" cy="190" r="95" fill="none" stroke="#475569" stroke-width="1.2" />
    <circle cx="980" cy="190" r="65" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="980" cy="190" r="35" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.8" />

    <!-- Expanding Dynamic Pulse Waves -->
    <circle class="pulse-circle-1" cx="980" cy="190" r="45" fill="none" stroke="#38bdf8" />
    <circle class="pulse-circle-2" cx="980" cy="190" r="20" fill="none" stroke="#818cf8" />

    <!-- Rotating Radar Beam -->
    <g class="radar-sweep-line">
      <line x1="980" y1="190" x2="1105" y2="190" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8" />
      <polygon points="980,190 1100,165 1105,190" fill="url(#glowCyan)" opacity="0.18" />
    </g>

    <!-- Network Circuit Connectors with Active Moving Dashes -->
    <path class="circuit-flow" d="M 820 90 L 910 140 L 980 190" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" />
    <path class="circuit-flow" d="M 800 280 L 890 230 L 980 190" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.6" />
    <path class="circuit-flow" d="M 980 190 L 1070 120 L 1130 140" fill="none" stroke="#34d399" stroke-width="1.8" opacity="0.6" />
    <path class="circuit-flow" d="M 980 190 L 1060 260 L 1120 250" fill="none" stroke="#f472b6" stroke-width="1.8" opacity="0.6" />

    <!-- Simulated Monitored Vendor Nodes -->
    <g transform="translate(820, 90)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle class="beacon-dot" cx="0" cy="0" r="5" fill="#38bdf8" />
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" font-weight="600">SaaS / API</text>
    </g>

    <g transform="translate(800, 280)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle class="beacon-dot" cx="0" cy="0" r="5" fill="#818cf8" />
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" font-weight="600">Supply Chain</text>
    </g>

    <g transform="translate(1130, 140)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <circle class="beacon-dot" cx="0" cy="0" r="5" fill="#34d399" />
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" font-weight="600">SOC 2 / ISO</text>
    </g>

    <g transform="translate(1120, 250)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#f472b6" stroke-width="2" />
      <circle class="beacon-dot" cx="0" cy="0" r="5" fill="#f472b6" />
      <text x="0" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" font-weight="600">SBOM / OSS</text>
    </g>
  </g>

  <!-- Left / Center Graphic: Decorative Security Shield Icon -->
  <g class="floating-card" transform="translate(68, 55)">
    <!-- Back Glow -->
    <polygon points="45,0 90,20 90,65 45,95 0,65 0,20" fill="url(#shieldGrad)" filter="url(#softGlow)" opacity="0.6" />
    <!-- Front Crisp Shield -->
    <polygon points="45,4 85,22 85,62 45,90 5,62 5,22" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Inner VRM Checkmark / Nodes -->
    <path d="M 28 46 L 40 58 L 64 34" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- High-Contrast Foreground Typography -->
  <!-- Top Category Chip / Pill -->
  <g transform="translate(180, 52)">
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="30" y="18" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Hero Title -->
  <text x="68" y="142" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome Vendor Risk Management
  </text>
  <text x="68" y="190" fill="url(#accentGrad)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    (VRM &amp; TPRM)
  </text>

  <!-- Hero Subtitle -->
  <text x="68" y="235" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="500">
    Curated SaaS Platforms, Open-Source Tools &amp; Frameworks for Third-Party Cyber Risk &amp; Compliance
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(68, 275)">
    <!-- Pill 1: Third-Party Risk -->
    <g transform="translate(0, 0)">
      <rect width="175" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">🛡️ Third-Party Risk</text>
    </g>

    <!-- Pill 2: Continuous Monitoring -->
    <g transform="translate(187, 0)">
      <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">📊 Continuous Monitoring</text>
    </g>

    <!-- Pill 3: Questionnaire Scoring -->
    <g transform="translate(394, 0)">
      <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">📑 Questionnaire Scoring</text>
    </g>

    <!-- Pill 4: SBOM & Supply Chain -->
    <g transform="translate(601, 0)">
      <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">🔍 SBOM &amp; Supply Chain</text>
    </g>

    <!-- Pill 5: GRC Automation -->
    <g transform="translate(803, 0)">
      <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600">⚖️ GRC Automation</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="374" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>